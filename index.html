<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MicroBlog</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
    color:#fff;
}

.container{
    max-width:700px;
    margin:auto;
    border-left:1px solid #222;
    border-right:1px solid #222;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    background:rgba(0,0,0,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #222;
    padding:20px;
    z-index:100;
}

header h1{
    font-size:24px;
}

.post-box{
    padding:20px;
    border-bottom:1px solid #222;
}

textarea{
    width:100%;
    min-height:120px;
    resize:none;
    background:#111;
    border:1px solid #333;
    color:white;
    border-radius:12px;
    padding:15px;
    font-size:16px;
}

.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
}

.counter{
    color:#999;
}

button{
    border:none;
    background:white;
    color:black;
    font-weight:bold;
    padding:12px 20px;
    border-radius:999px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.timeline{
    width:100%;
}

.post{
    padding:20px;
    border-bottom:1px solid #222;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#444;
}

.name{
    font-weight:bold;
}

.date{
    color:#888;
    font-size:13px;
}

.content{
    margin-top:10px;
    line-height:1.6;
    white-space:pre-wrap;
}

.actions{
    display:flex;
    gap:20px;
    margin-top:15px;
}

.action-btn{
    background:none;
    color:#999;
    border:none;
    cursor:pointer;
}

.action-btn:hover{
    color:white;
}

.loading{
    text-align:center;
    padding:20px;
    color:#888;
}

@media(max-width:600px){

    header h1{
        font-size:20px;
    }

    textarea{
        min-height:100px;
    }

}
</style>
</head>
<body>

<div class="container">

<header>
    <h1>MicroBlog</h1>
</header>

<section class="post-box">

    <textarea
        id="postText"
        maxlength="280"
        placeholder="O que está acontecendo?">
    </textarea>

    <div class="controls">
        <div class="counter">
            <span id="count">0</span>/280
        </div>

        <button onclick="publicar()">
            Publicar
        </button>
    </div>

</section>

<section id="timeline" class="timeline">
    <div class="loading">Carregando...</div>
</section>

</div>

<script>

/*
=================================================
COLE A URL DO SEU WEB APP AQUI
=================================================
*/
const CONFIG = {
    WEB_APP_URL: "https://script.google.com/macros/s/AKfycbwwJJG9irU0Mn9q10mW10HHzUMoWGdSiPAheZcveQ0AMPTZOPdATJZZDLwxklgchLtr6w/exec"
};

const postText = document.getElementById("postText");
const count = document.getElementById("count");

postText.addEventListener("input", () => {
    count.textContent = postText.value.length;
});

function jsonp(url, callbackName){

    return new Promise((resolve, reject)=>{

        const script = document.createElement("script");

        window[callbackName] = function(data){

            resolve(data);

            delete window[callbackName];

            script.remove();
        };

        script.onerror = reject;

        script.src = url +
            (url.includes("?") ? "&" : "?") +
            "callback=" + callbackName;

        document.body.appendChild(script);
    });

}

async function publicar(){

    const texto = postText.value.trim();

    if(!texto){
        alert("Digite algo.");
        return;
    }

    const callback =
        "cb_" + Date.now();

    const url =
        CONFIG.WEB_APP_URL +
        "?action=add" +
        "&text=" +
        encodeURIComponent(texto);

    try{

        const resposta =
            await jsonp(url, callback);

        if(resposta.success){

            postText.value = "";
            count.textContent = "0";

            carregarPosts();

        }else{

            alert("Erro ao salvar.");

        }

    }catch(err){

        console.error(err);

        alert("Falha na conexão.");

    }

}

async function carregarPosts(){

    const callback =
        "list_" + Date.now();

    const url =
        CONFIG.WEB_APP_URL +
        "?action=list";

    try{

        const dados =
            await jsonp(url, callback);

        renderizar(dados.posts || []);

    }catch(err){

        console.error(err);

    }

}

function renderizar(posts){

    const timeline =
        document.getElementById("timeline");

    if(posts.length === 0){

        timeline.innerHTML =
            '<div class="loading">Nenhuma publicação.</div>';

        return;
    }

    timeline.innerHTML = "";

    posts.forEach(post=>{

        const div =
            document.createElement("div");

        div.className = "post";

        div.innerHTML = `
            <div class="post-header">
                <div class="avatar"></div>

                <div>
                    <div class="name">
                        Usuário
                    </div>

                    <div class="date">
                        ${post.date}
                    </div>
                </div>
            </div>

            <div class="content">
                ${escapeHtml(post.text)}
            </div>

            <div class="actions">

                <button class="action-btn">
                    💬 Comentário
                </button>

                <button class="action-btn">
                    🔁 Repostar
                </button>

                <button class="action-btn">
                    ❤️ Curtir
                </button>

                <button class="action-btn">
                    📤 Compartilhar
                </button>

            </div>
        `;

        timeline.appendChild(div);

    });

}

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

carregarPosts();

</script>

</body>
</html>
